---
- hosts: localhost
  connection: local
  become_exe: sudo.ws
  vars:
    ansible_python_interpreter: /usr/bin/python3
  vars_files:
    - vars.json
  tasks:
    - name: Install required tool packages
      apt:
        state: present
        name:
          - git
          - git-delta
          - net-tools
          - curl
          - wget
          - openssh-client
          - moreutils
          - build-essential
          - screen
          - traceroute
          - sl
          - ripgrep
          - duf
          - whois
          - pwgen
          # XClip for neovim clipboard support
          - xclip
    - name: Install user specified apt packages
      apt:
        state: present
        name: "{{ userAptPackages }}"
    - name: Install user specified snap packages
      command: snap install {{package.pkg}} {{'--classic' if 'classic' in package else ''}}
      become: yes
      loop: "{{ userSnapPackages }}"
      loop_control:
        loop_var: package

  roles:
    - { role: xmonad, when: userRoles.xmonad }
    - { role: dotfiles , when: userRoles.dotfiles }
    - { role: andrewrothstein.starship, when: userRoles.starship }
    - role: markosamuli.nvm
      when: userRoles.nvm
      vars:
        nvm_shell_init: no
